<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Users - JobTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            JobTrack
        </div>

        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="manage-users.html">
                Manage Users
            </a>

            <a href="all-applications.html">
                All Applications
            </a>

            <a href="index.html" id="logoutBtn">
                Logout
            </a>

        </nav>

    </header>


    <main class="applications-page">

        <div class="applications-header">

            <div>

                <p class="small-title">
                    ADMIN PANEL
                </p>

                <h1>
                    Manage Users
                </h1>

                <p>
                    View all registered JobTrack users.
                </p>

            </div>

        </div>


        <section class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="usersTableBody">

                        <!-- Users will be displayed using JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
