<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - JobTrack</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- Logo -->
        <a href="index.html" class="logo">
            JobTrack
        </a>

        <h1>Create an Account</h1>

        <p class="auth-subtitle">
            Join and start tracking your career journey
        </p>


        <!-- Signup Form -->
        <form id="signupForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn signup-submit"
            >
                Sign Up
            </button>

        </form>


        <!-- Message -->
        <p id="signupMessage" class="form-message"></p>


        <!-- Login Link -->
        <p class="bottom-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <!-- Back to Home -->
        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>
    <script src="app.js"></script>
</body>

</html>
